<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00d8ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d8ff" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .bar { animation: grow 2.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      .b2 { animation-delay: .3s } .b3 { animation-delay: .6s } .b4 { animation-delay: .9s } .b5 { animation-delay: 1.2s }
      @keyframes grow { from { transform: scaleY(.6) } to { transform: scaleY(1) } }
    </style>
  </defs>
  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <circle cx="900" cy="40" r="130" fill="#00d8ff" opacity="0.06"/>
  <circle cx="80" cy="240" r="110" fill="#00d8ff" opacity="0.06"/>

  <!-- decorative bar chart -->
  <g>
    <rect class="bar" x="760" y="150" width="30" height="80" rx="4" fill="url(#bar)"/>
    <rect class="bar b2" x="800" y="110" width="30" height="120" rx="4" fill="url(#bar)"/>
    <rect class="bar b3" x="840" y="130" width="30" height="100" rx="4" fill="url(#bar)"/>
    <rect class="bar b4" x="880" y="80" width="30" height="150" rx="4" fill="url(#bar)"/>
    <rect class="bar b5" x="920" y="100" width="30" height="130" rx="4" fill="url(#bar)"/>
  </g>

  <text x="60" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Divyesh Jadav</text>
  <rect x="62" y="132" width="90" height="4" rx="2" fill="#00d8ff"/>
  <text x="60" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cfe9f1">Aspiring Data Analyst  |  Dashboard Builder</text>
  <text x="60" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8fb8c7">Python  •  SQL  •  Excel  •  Power BI</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
